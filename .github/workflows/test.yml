name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: skills/todo-stack/scripts/todo-stack/go.sum
      - run: go install github.com/kisielk/errcheck@v1.9.0
      - run: make all
